name: Validate catalog

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate catalog data
        run: python scripts/validate_catalog.py
      - name: Check generated browser data
        run: python scripts/build_catalog_data.py && git diff --exit-code -- docs/data/catalog-data.js
